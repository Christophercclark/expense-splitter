<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Splitter</title>
<style>
body{font-family:Arial;background:#f0fdf4;padding:20px}
main{max-width:700px;margin:auto;background:white;padding:25px;border-radius:15px}
input,select{width:100%;padding:11px;margin:8px 0;box-sizing:border-box}
button{padding:11px 16px;background:#15803d;color:white;border:0;border-radius:7px;cursor:pointer}
.card{background:#dcfce7;padding:14px;margin:10px 0;border-radius:8px}
.person{display:inline-block;margin:6px}
</style>
</head>
<body>
<main>
<h1>Expense Splitter</h1>

<h3>1. Add Participants</h3>
<input id="members" placeholder="Names separated by commas">
<button onclick="setMembers()">Save Participants</button>

<h3>2. Add Expense</h3>
<input id="description" placeholder="Expense description">
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount">
<select id="payer"></select>

<h4>Split Among</h4>
<div id="participants"></div>

<button onclick="addExpense()">Add Expense</button>

<h3>Expense History</h3>
<div id="history"></div>

<h3>Settlement Summary</h3>
<div id="settlement"></div>
<p id="status"></p>
</main>

<script>
let people=JSON.parse(localStorage.getItem("splitPeople")||"[]");
let expenses=JSON.parse(localStorage.getItem("splitExpenses")||"[]");

function persist(){
 localStorage.setItem("splitPeople",JSON.stringify(people));
 localStorage.setItem("splitExpenses",JSON.stringify(expenses));
 render();
}

function setMembers(){
 const names=document.getElementById("members").value
 .split(",").map(x=>x.trim()).filter(Boolean);
 const unique=[...new Set(names)];
 if(unique.length<2){
  alert("Enter at least two different participants.");
  return;
 }
 if(expenses.length){
  alert("Clear existing expenses before changing participants.");
  return;
 }
 people=unique;
 persist();
}

function render(){
 const payer=document.getElementById("payer");
 payer.innerHTML="";
 people.forEach(name=>{
  const option=document.createElement("option");
  option.value=name;
  option.textContent=name;
  payer.appendChild(option);
 });

 const box=document.getElementById("participants");
 box.innerHTML="";
 people.forEach((name,i)=>{
  const label=document.createElement("label");
  label.className="person";
  const check=document.createElement("input");
  check.type="checkbox";
  check.value=name;
  check.checked=true;
  label.append(check,document.createTextNode(name));
  box.appendChild(label);
 });

 const history=document.getElementById("history");
 history.innerHTML="";
 expenses.forEach((e,i)=>{
  const card=document.createElement("div");
  card.className="card";
  const text=document.createElement("span");
  text.textContent=`${e.description}: ${e.amount.toFixed(2)} paid by ${e.payer}`;
  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>{expenses.splice(i,1);persist();};
  card.append(text,document.createTextNode(" "),del);
  history.appendChild(card);
 });
 updateSettlement();
}

function addExpense(){
 const description=document.getElementById("description").value.trim();
 const field=document.getElementById("amount");
 const amount=Number(field.value);
 const payer=document.getElementById("payer").value;
 const selected=[...document.querySelectorAll("#participants input:checked")]
 .map(x=>x.value);

 if(!people.length||!description||field.value===""||
 !Number.isFinite(amount)||amount<=0||!payer||!selected.length){
  document.getElementById("status").textContent=
  "Complete all fields and select participants.";
  return;
 }

 expenses.push({description,amount,payer,selected});
 document.getElementById("description").value="";
 field.value="";
 document.getElementById("status").textContent="Expense added.";
 persist();
}

function updateSettlement(){
 const balances={};
 people.forEach(p=>balances[p]=0);

 expenses.forEach(e=>{
  balances[e.payer]+=e.amount;
  const share=e.amount/e.selected.length;
  e.selected.forEach(p=>balances[p]-=share);
 });

 const debtors=people.map(p=>({name:p,value:-balances[p]}))
 .filter(x=>x.value>0.005);
 const creditors=people.map(p=>({name:p,value:balances[p]}))
 .filter(x=>x.value>0.005);

 const result=document.getElementById("settlement");
 result.innerHTML="";

 let i=0,j=0;
 while(i<debtors.length&&j<creditors.length){
  const amount=Math.min(debtors[i].value,creditors[j].value);
  const line=document.createElement("p");
  line.textContent=
  `${debtors[i].name} pays ${creditors[j].name}: ${amount.toFixed(2)}`;
  result.appendChild(line);
  debtors[i].value-=amount;
  creditors[j].value-=amount;
  if(debtors[i].value<0.005)i++;
  if(creditors[j].value<0.005)j++;
 }
 if(!result.children.length)result.textContent="All expenses are settled.";
}

render();
</script>
</body>
</html>
