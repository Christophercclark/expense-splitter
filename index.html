<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Splitter</title>
<style>
body{font-family:Arial;background:#eff6ff;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{padding:12px 18px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
#result{background:#dbeafe;padding:18px;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Expense Splitter</h1>
<p>Calculate how much each person should pay.</p>
<input id="total" type="number" min="0" step="any" placeholder="Total expense">
<input id="people" type="number" min="1" step="1" placeholder="Number of people">
<button onclick="splitExpense()">Split Expense</button>
<div id="result">Your result will appear here.</div>
</main>
<script>
function splitExpense(){
 const totalField=document.getElementById("total");
 const peopleField=document.getElementById("people");
 const total=Number(totalField.value);
 const people=Number(peopleField.value);
 const result=document.getElementById("result");
 if(totalField.value===""||peopleField.value===""||
 total<0||!Number.isInteger(people)||people<1){
  result.textContent="Enter a valid expense and number of people.";
  return;
 }
 result.textContent=
 "Total Expense: "+total.toFixed(2)+
 " | Each Person Pays: "+(total/people).toFixed(2);
}
</script>
</body>
</html>
